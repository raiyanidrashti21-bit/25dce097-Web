<!DOCTYPE html>
<html>

<head>

    <title>StudentHub Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <!-- Back to Dashboard -->

    <div class="backButton">

        <a href="dashboard.html">
            ← 
        </a>

    </div>


    <!-- Login Heading -->

    <h1>STUDENTHUB LOGIN</h1>


    <!-- Login Form -->

    <form action="studentDashboard.html">
        <fieldset>

            <legend>
                <b>Login Details</b>
            </legend>


            <!-- Student ID -->

            <label>
                <b>Student ID :</b>
            </label>

            <br>

            <input
                type="text"
                placeholder="Enter Student ID"
            >

            <br>


            <!-- Password -->

            <label>
                <b>Password :</b>
            </label>

            <br>

            <input
                type="password"
                placeholder="Enter Password"
            >

            <br>


            <!-- Login -->

            <input
                type="submit"
                value="Login"
            >

            <br><br>


            <!-- Clear -->

            <input
                type="reset"
                value="Clear"
            >

        </fieldset>

    </form>


    <!-- Other Links -->

    <div class="links">

        <a href="#">
            Forgot Password?
        </a>

    </div>


</body>

</html>
